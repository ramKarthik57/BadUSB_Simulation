<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" style="background:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ================= TOP ROW STATES (y: 50 to 98, height: 48) ================= -->
  <!-- 1. STATE_BOOTING (x: 18 to 118, width: 100) -->
  <rect x="18" y="50" width="100" height="48" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="68" y="69" font-size="9.8" font-weight="bold" fill="#1e3a8a" text-anchor="middle">STATE_BOOTING</text>
  <text x="68" y="85" font-size="8.2" fill="#1d4ed8" text-anchor="middle">Power-On &amp; USB Init</text>

  <!-- Arrow: BOOTING -> USB_WAIT -->
  <line x1="118" y1="74" x2="164" y2="74" stroke="#2563eb" stroke-width="1.3"/>
  <polygon points="166,74 160.5,70.7 162.2,74 160.5,77.3" fill="#2563eb"/>
  <text x="141" y="68" font-size="7.8" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Init OK</text>

  <!-- 2. STATE_USB_WAIT (x: 166 to 276, width: 110) -->
  <rect x="166" y="50" width="110" height="48" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="221" y="69" font-size="9.8" font-weight="bold" fill="#1e3a8a" text-anchor="middle">STATE_USB_WAIT</text>
  <text x="221" y="85" font-size="8.2" fill="#1d4ed8" text-anchor="middle">Host Enum &#916;t &#8805; 3.5s</text>

  <!-- Arrow: USB_WAIT -> STARTUP_PAYLOAD -->
  <line x1="276" y1="74" x2="324" y2="74" stroke="#2563eb" stroke-width="1.3"/>
  <polygon points="326,74 320.5,70.7 322.1,74 320.5,77.3" fill="#2563eb"/>
  <!-- Centered Enum Badge -->
  <rect x="286" y="66" width="30" height="15" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="301" y="77" font-size="7.8" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Enum</text>

  <!-- 3. STATE_STARTUP_PAYLOAD (x: 326 to 468, width: 142) -->
  <rect x="326" y="50" width="142" height="48" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="397" y="69" font-size="9.8" font-weight="bold" fill="#92400e" text-anchor="middle">STATE_STARTUP_PAYLOAD</text>
  <text x="397" y="85" font-size="8.2" fill="#b45309" text-anchor="middle">Scenario 1 Injection</text>

  <!-- Arrow: STARTUP_PAYLOAD -> IDLE -->
  <line x1="468" y1="74" x2="512" y2="74" stroke="#2563eb" stroke-width="1.3"/>
  <polygon points="514,74 508.5,70.7 510.1,74 508.5,77.3" fill="#2563eb"/>
  <text x="490" y="68" font-size="7.8" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Done</text>

  <!-- 4. STATE_IDLE (x: 514 to 604, width: 90) -->
  <rect x="514" y="50" width="90" height="48" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="559" y="69" font-size="9.8" font-weight="bold" fill="#14532d" text-anchor="middle">STATE_IDLE</text>
  <text x="559" y="85" font-size="8.0" fill="#166534" text-anchor="middle">Quiescent / Ready</text>

  <!-- Forward Arc: IDLE -> RUNNING (REST Command Authenticated) -->
  <path d="M 604 62 L 646 62" stroke="#16a34a" stroke-width="1.3" fill="none"/>
  <polygon points="648,62 642.5,58.7 644.1,62 642.5,65.3" fill="#16a34a"/>
  <text x="626" y="47" font-size="7.6" font-weight="bold" fill="#15803d" text-anchor="middle">REST Command</text>
  <text x="626" y="57" font-size="7.0" fill="#166534" text-anchor="middle">(Authenticated)</text>

  <!-- Reverse Arc: RUNNING -> IDLE (Complete) -->
  <path d="M 648 86 L 606 86" stroke="#2563eb" stroke-width="1.3" fill="none"/>
  <polygon points="604,86 609.5,82.7 607.9,86 609.5,89.3" fill="#2563eb"/>
  <text x="626" y="98" font-size="7.6" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Complete</text>

  <!-- 5. STATE_RUNNING (x: 648 to 746, width: 98) -->
  <rect x="648" y="50" width="98" height="48" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="697" y="68" font-size="9.8" font-weight="bold" fill="#991b1b" text-anchor="middle">STATE_RUNNING</text>
  <text x="697" y="81" font-size="8.0" fill="#b91c1c" text-anchor="middle">Payload Active</text>
  <text x="697" y="92" font-size="7.4" fill="#dc2626" text-anchor="middle">Quantum &#948;t = 10ms</text>

  <!-- ================= ASYNCHRONOUS ERROR RECOVERY ARC ================= -->
  <!-- Long orange arc: RUNNING -> USB_WAIT (via top headroom y=18) -->
  <path d="M 697 50 L 697 18 L 221 18 L 221 48" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="4,2.5" fill="none"/>
  <polygon points="221,50 217.7,44.5 221,46.1 224.3,44.5" fill="#ea580c"/>
  <rect x="390" y="10" width="144" height="16" rx="3" fill="#fff7ed" stroke="#fdba74" stroke-width="0.8"/>
  <text x="462" y="21.5" font-size="7.8" font-weight="bold" fill="#c2410c" text-anchor="middle">USB Disconnect / Bus Drop</text>

  <!-- ================= BOTTOM ROW STATES (y: 154 to 204, height: 50) ================= -->
  <!-- 6. STATE_ERROR (x: 166 to 276, width: 110) -->
  <rect x="166" y="154" width="110" height="50" rx="5" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="221" y="174" font-size="9.8" font-weight="bold" fill="#9f1239" text-anchor="middle">STATE_ERROR</text>
  <text x="221" y="191" font-size="8.2" fill="#be123c" text-anchor="middle">Watchdog / Bus Fault</text>

  <!-- Arrow: USB_WAIT -> ERROR -->
  <line x1="221" y1="98" x2="221" y2="152" stroke="#e11d48" stroke-width="1.3"/>
  <polygon points="221,154 217.7,148.5 221,150.2 224.3,148.5" fill="#e11d48"/>
  <text x="228" y="128" font-size="7.6" fill="#be123c" text-anchor="start">Enum Timeout</text>

  <!-- Loop: ERROR -> BOOTING (WDT Reboot) -->
  <path d="M 166 186 L 68 186 L 68 100" stroke="#e11d48" stroke-width="1.3" stroke-dasharray="3,2" fill="none"/>
  <polygon points="68,98 64.7,103.5 68,101.8 71.3,103.5" fill="#e11d48"/>
  <text x="110" y="180" font-size="7.8" font-weight="bold" fill="#9f1239" text-anchor="middle">WDT Reboot</text>

  <!-- 7. STATE_STOPPING (x: 648 to 746, width: 98) -->
  <rect x="648" y="154" width="98" height="50" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="697" y="174" font-size="9.8" font-weight="bold" fill="#92400e" text-anchor="middle">STATE_STOPPING</text>
  <text x="697" y="188" font-size="8.0" fill="#b45309" text-anchor="middle">Preempt Request</text>
  <text x="697" y="199" font-size="7.2" fill="#d97706" text-anchor="middle">Mailbox &#966;_stop = 1</text>

  <!-- Arrow: RUNNING -> STOPPING -->
  <line x1="697" y1="98" x2="697" y2="152" stroke="#d97706" stroke-width="1.3"/>
  <polygon points="697,154 693.7,148.5 697,150.2 700.3,148.5" fill="#d97706"/>
  <text x="704" y="128" font-size="7.6" font-weight="bold" fill="#b45309" text-anchor="start">Abort (&#966;=1)</text>

  <!-- 8. STATE_STOPPED (x: 504 to 614, width: 110) -->
  <rect x="504" y="154" width="110" height="50" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="559" y="172" font-size="9.8" font-weight="bold" fill="#334155" text-anchor="middle">STATE_STOPPED</text>
  <text x="559" y="185" font-size="8.0" fill="#475569" text-anchor="middle">Atomic Teardown</text>
  <text x="559" y="197" font-size="7.4" font-weight="bold" fill="#0f172a" text-anchor="middle">Deassert Flags (State Clear)</text>

  <!-- Arrow: STOPPING -> STOPPED -->
  <line x1="648" y1="179" x2="616" y2="179" stroke="#64748b" stroke-width="1.3"/>
  <polygon points="614,179 619.5,175.7 617.9,179 619.5,182.3" fill="#64748b"/>
  <text x="631" y="173" font-size="7.6" font-weight="bold" fill="#475569" text-anchor="middle">&#8804;10ms</text>

  <!-- Arrow: STOPPED -> IDLE -->
  <line x1="559" y1="154" x2="559" y2="100" stroke="#16a34a" stroke-width="1.3"/>
  <polygon points="559,98 555.7,103.5 559,101.8 562.3,103.5" fill="#16a34a"/>
  <text x="566" y="128" font-size="7.6" fill="#15803d" text-anchor="start">Flags OK</text>
</svg>